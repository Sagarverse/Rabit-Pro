<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabit Pro | File Bridge Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian: #0A0A0B;
            --graphite: #1C1C1E;
            --platinum: #F2F2F7;
            --accent-blue: #0A84FF;
            --accent-gold: #FFD60A;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--obsidian);
            color: var(--platinum);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(10, 132, 255, 0.2);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        p.subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin-bottom: 32px;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #34C759;
            box-shadow: 0 0 10px #34C759;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .pin-input-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input {
            background: var(--graphite);
            border: 1px solid var(--border);
            color: var(--platinum);
            padding: 20px;
            font-size: 18px;
            border-radius: 20px;
            text-align: center;
            font-weight: 800;
            letter-spacing: 4px;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(10, 132, 255, 0.1);
        }

        button {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .file-list {
            display: none;
            margin-top: 32px;
            text-align: left;
        }

        .file-item {
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .footer {
            margin-top: 40px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rabit Pro Hub</h1>
        <p class="subtitle">Secure Internet File Sharing Bridge</p>

        <div class="status-box">
            <div class="indicator" id="status-light"></div>
            <span id="status-text">Connected to Signaling Server</span>
        </div>

        <!-- Step 1: Manual Peer ID Entry (Fallback) -->
        <div class="pin-input-group" id="peer-setup" style="display: none;">
            <p style="font-size: 12px; margin-bottom: 8px; opacity: 0.6">Enter the 6-character Peer ID from your Rabit mobile app</p>
            <input type="text" id="manual-peer-field" maxlength="6" placeholder="PEERID" style="text-transform: uppercase;">
            <button onclick="savePeerId()">Securely Link Peer</button>
        </div>

        <!-- Step 2: PIN Authorization -->
        <div class="pin-input-group" id="auth-section">
            <p style="font-size: 12px; margin-bottom: 8px; opacity: 0.6">Enter the 4-digit security PIN from your phone</p>
            <input type="text" id="pin-field" maxlength="4" placeholder="••••" autocomplete="off">
            <button onclick="connect()">Authorize Device Bridge</button>
        </div>

        <div class="file-list" id="file-hub">
            <p class="subtitle" style="margin-bottom: 16px;">Available Files on Phone</p>
            <div id="items">
                <!-- Dynamic File Items -->
            </div>
        </div>
    </div>

    <div class="footer">Encrypted Peer-to-Peer Hub Security</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Configuration (Using defaults from Hosting context)
        // These will be automatically populated if deployed to Firebase Hosting, 
        // but for local dev, we use placeholders that the user can replace.
        const firebaseConfig = {
            storageBucket: "zoom-sagar.appspot.com",
            projectId: "zoom-sagar",
            appId: "1:262319086300:web:86f6a9c1e7c5b967f1307b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // WebRTC & Connectivity Logic
        let peerId = new URLSearchParams(window.location.search).get('peer');
        const statusText = document.getElementById('status-text');
        const authSection = document.getElementById('auth-section');
        const peerSetup = document.getElementById('peer-setup');
        const fileHub = document.getElementById('file-hub');
        const statusLight = document.getElementById('status-light');

        let pc = null;
        let dataChannel = null;

        window.savePeerId = function() {
            const manualId = document.getElementById('manual-peer-field').value.trim();
            if (manualId.length < 4) return alert("Please enter a valid Peer ID");
            peerId = manualId;
            init();
        }

        async function init() {
            if (!peerId) {
                statusText.innerText = "Awaiting Peer Identity...";
                statusLight.style.background = "#FFD60A";
                statusLight.style.boxShadow = "0 0 10px #FFD60A";
                authSection.style.display = 'none';
                peerSetup.style.display = 'flex';
            } else {
                statusText.innerText = `Bridged to Peer: ${peerId.toUpperCase()}`;
                peerSetup.style.display = 'none';
                authSection.style.display = 'flex';
                statusLight.style.background = "#0A84FF";
                statusLight.style.boxShadow = "0 0 10px #0A84FF";
            }
        }

        init();

        window.connect = async function() {
            const pin = document.getElementById('pin-field').value;
            if (pin.length !== 4) return alert("Please enter the 4-digit security PIN");

            statusText.innerText = "Initializing Professional Secure Bridge...";
            
            try {
                await startHandshake();
            } catch (e) {
                console.error(e);
                statusText.innerText = "Bridge Handshake Failed";
                statusLight.style.background = "#FF453A";
            }
        }

        async function startHandshake() {
            pc = new RTCPeerConnection({
                iceServers: [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }]
            });

            dataChannel = pc.createDataChannel("rabit_control");
            setupDataChannel(dataChannel);

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const signalRef = doc(db, "signals", peerId.toUpperCase());
                    updateDoc(signalRef, {
                        web_candidates: arrayUnion(JSON.stringify(event.candidate))
                    });
                }
            };

            // Create Offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            // Write Offer to Firestore
            const signalRef = doc(db, "signals", peerId.toUpperCase());
            await setDoc(signalRef, {
                web_offer: offer.sdp,
                timestamp: Date.now()
            });

            statusText.innerText = "Awaiting Phone Authorization...";

            // Listen for Answer and Candidates from Phone
            onSnapshot(signalRef, async (snapshot) => {
                const data = snapshot.data();
                if (!data) return;

                if (data.app_answer && !pc.remoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription({
                        type: 'answer',
                        sdp: data.app_answer
                    }));
                    statusText.innerText = "Identity Authenticated. Tunneling...";
                }

                if (data.app_candidates) {
                    data.app_candidates.forEach(candStr => {
                        const candidate = JSON.parse(candStr);
                        pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => {});
                    });
                }
            });
        }

        function setupDataChannel(dc) {
            dc.onopen = () => {
                statusText.innerText = "Pro Bridge Active & Secure";
                statusLight.style.background = "#34C759";
                authSection.style.display = 'none';
                fileHub.style.display = 'block';
                
                // Demo file list refresh
                document.getElementById('items').innerHTML = `
                    <div class="file-item">
                        <div>
                            <p style="font-weight: bold; font-size: 14px;">Mac_Setup_Helper.dmg</p>
                            <p style="font-size: 11px; opacity: 0.5;">Compressed Archive • 2.4 GB</p>
                        </div>
                        <button style="padding: 8px 16px; font-size: 12px; background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); border-radius: 8px;">Retrieve</button>
                    </div>
                `;
            };

            dc.onmessage = (event) => {
                console.log("P2P Message:", event.data);
            };
        }
    </script>
</body>
</html>
